spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: users
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**,/api/auth/**
            - id: travels
              uri: ${TRAVEL_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/travels/**
            - id: payments
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/payment-methods/**,/api/payments/**
app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-must-be-at-least-32-bytes-long}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
