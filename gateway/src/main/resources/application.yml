spring:
  config:
    import: ${VAULT_CONFIG_IMPORT:optional:classpath:/vault-disabled.properties}
  application:
    name: gateway
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_URI:http://localhost:8200}
      token: ${VAULT_TOKEN:test-disabled-token}
      kv:
        enabled: true
        application-name: gateway
    gateway:
      server:
        webflux:
          routes:
            - id: users
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**,/api/auth/**
            - id: travels
              uri: ${TRAVEL_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/travels/**
            - id: payments
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/payment-methods/**,/api/payments/**
app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-must-be-at-least-32-bytes-long}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
