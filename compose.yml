name: travel-plan
services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports: ["8080:8080"]
    environment:
      USER_SERVICE_URL: http://user-service:8081
      TRAVEL_SERVICE_URL: http://travel-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      ENGAGEMENT_SERVICE_URL: http://engagement-service:8084
      VAULT_URI: http://vault:8200
      VAULT_CONFIG_IMPORT: vault://
      VAULT_ENABLED: "true"
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-local-development-root-token}
    depends_on:
      vault-init: { condition: service_completed_successfully }
      user-service: { condition: service_healthy }
      travel-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      engagement-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [edge, internal]

  user-service:
    build: { context: ., dockerfile: services/user-service/Dockerfile }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/users_db
      VAULT_URI: http://vault:8200
      VAULT_CONFIG_IMPORT: vault://
      VAULT_ENABLED: "true"
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-local-development-root-token}
    depends_on:
      postgres: { condition: service_healthy }
      vault-init: { condition: service_completed_successfully }
    healthcheck: &service-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]
    deploy:
      replicas: 2

  travel-service:
    build: { context: ., dockerfile: services/travel-service/Dockerfile }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/travels_db
      VAULT_URI: http://vault:8200
      VAULT_CONFIG_IMPORT: vault://
      VAULT_ENABLED: "true"
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-local-development-root-token}
    depends_on:
      postgres: { condition: service_healthy }
      vault-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *service-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
    networks: [internal]
    deploy:
      replicas: 2

  payment-service:
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payments_db
      VAULT_URI: http://vault:8200
      VAULT_CONFIG_IMPORT: vault://
      VAULT_ENABLED: "true"
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-local-development-root-token}
    depends_on:
      postgres: { condition: service_healthy }
      vault-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *service-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
    networks: [internal]
    deploy:
      replicas: 2

  engagement-service:
    build: { context: ., dockerfile: services/engagement-service/Dockerfile }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/engagement_db
      TRAVEL_SERVICE_URL: http://travel-service:8082
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4j_dev_only}
      VAULT_URI: http://vault:8200
      VAULT_CONFIG_IMPORT: vault://
      VAULT_ENABLED: "true"
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-local-development-root-token}
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      vault-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *service-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
    networks: [internal]
    deploy: { replicas: 2 }

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4j_dev_only}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [internal]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]

  vault:
    image: hashicorp/vault:1.20
    cap_add: [IPC_LOCK]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-local-development-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]

  vault-init:
    image: hashicorp/vault:1.20
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-local-development-root-token}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-must-be-at-least-32-bytes-long}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin123}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-System Administrator}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sandbox-not-configured}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-sandbox-not-configured}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-sandbox-not-configured}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        vault kv put secret/gateway app.security.jwt-secret="$$JWT_SECRET"
        vault kv put secret/user-service spring.datasource.username=users_app spring.datasource.password=users_dev_only app.security.jwt-secret="$$JWT_SECRET" app.bootstrap-admin.email="$$BOOTSTRAP_ADMIN_EMAIL" app.bootstrap-admin.password="$$BOOTSTRAP_ADMIN_PASSWORD" app.bootstrap-admin.name="$$BOOTSTRAP_ADMIN_NAME"
        vault kv put secret/travel-service spring.datasource.username=travels_app spring.datasource.password=travels_dev_only app.security.jwt-secret="$$JWT_SECRET"
        vault kv put secret/payment-service spring.datasource.username=payments_app spring.datasource.password=payments_dev_only app.security.jwt-secret="$$JWT_SECRET" app.payments.stripe-secret-key="$$STRIPE_SECRET_KEY" app.payments.paypal-client-id="$$PAYPAL_CLIENT_ID" app.payments.paypal-client-secret="$$PAYPAL_CLIENT_SECRET"
        vault kv put secret/engagement-service spring.datasource.username=engagement_app spring.datasource.password=engagement_dev_only app.security.jwt-secret="$$JWT_SECRET"
    depends_on:
      vault: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [internal]

  loki:
    image: grafana/loki:3.5.3
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./infra/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  promtail:
    image: grafana/promtail:3.5.3
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki: { condition: service_healthy }
    networks: [internal]

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin_dev_only}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [edge, internal]

networks:
  edge: {}
  internal:
    internal: true
volumes:
  postgres-data: {}
  neo4j-data: {}
  elasticsearch-data: {}
  grafana-data: {}
  loki-data: {}
