services:
  jenkins:
    build:
      context: .
      dockerfile: infra/jenkins/Dockerfile
    ports:
      - "8085:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=true
    volumes:
      - jenkins-data:/var/jenkins_home
    networks: [ci]

  sonar-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar-local-only}
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ci]

  sonarqube:
    image: sonarqube:lts-community
    depends_on:
      sonar-db: { condition: service_healthy }
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar-local-only}
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks: [ci]

networks:
  ci: {}

volumes:
  jenkins-data: {}
  sonar-db-data: {}
  sonarqube-data: {}
  sonarqube-extensions: {}
  sonarqube-logs: {}
