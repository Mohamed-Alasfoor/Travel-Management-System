spring:
  application:
    name: travel-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/travels_db}
    username: ${DB_USERNAME:travels_app}
    password: ${DB_PASSWORD:travels_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

