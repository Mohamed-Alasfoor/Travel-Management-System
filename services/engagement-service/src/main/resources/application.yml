spring:
  config:
    import: ${VAULT_CONFIG_IMPORT:optional:classpath:/vault-disabled.properties}
  application:
    name: engagement-service
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_URI:http://localhost:8200}
      token: ${VAULT_TOKEN:test-disabled-token}
      kv: { enabled: true, application-name: engagement-service }
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/engagement_db}
    username: ${DB_USERNAME:engagement_app}
    password: ${DB_PASSWORD:engagement_dev_only}
  jpa:
    open-in-view: false
    hibernate: { ddl-auto: validate }
  flyway: { enabled: true }
server: { address: 0.0.0.0, port: 8084 }
app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-must-be-at-least-32-bytes-long}
  travel-service-url: ${TRAVEL_SERVICE_URL:http://localhost:8082}
  elasticsearch-url: ${ELASTICSEARCH_URL:http://localhost:9200}
  neo4j-uri: ${NEO4J_URI:bolt://localhost:7687}
  neo4j-auth: ${NEO4J_AUTH:neo4j/neo4j_dev_only}
management.endpoints.web.exposure.include: health,info,prometheus
