spring:
  config:
    import: ${VAULT_CONFIG_IMPORT:optional:classpath:/vault-disabled.properties}
  application:
    name: payment-service
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_URI:http://localhost:8200}
      token: ${VAULT_TOKEN:test-disabled-token}
      kv:
        enabled: true
        application-name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments_db}
    username: ${DB_USERNAME:payments_app}
    password: ${DB_PASSWORD:payments_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8083}
app.security.jwt-secret: ${JWT_SECRET:dev-only-secret-must-be-at-least-32-bytes-long}
app.payments:
  stripe-secret-key: ${STRIPE_SECRET_KEY:sandbox-not-configured}
  paypal-client-id: ${PAYPAL_CLIENT_ID:sandbox-not-configured}
  paypal-client-secret: ${PAYPAL_CLIENT_SECRET:sandbox-not-configured}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
