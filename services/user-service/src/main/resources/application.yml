spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/users_db}
    username: ${DB_USERNAME:users_app}
    password: ${DB_PASSWORD:users_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8081}
app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-must-be-at-least-32-bytes-long}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:admin123}
    name: ${BOOTSTRAP_ADMIN_NAME:System Administrator}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
