services:
  gateway:
    ports: !override []

  grafana:
    ports: !override []

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public DNS name}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway: { condition: service_healthy }
    networks: [edge, internal]

volumes:
  caddy-data: {}
  caddy-config: {}
