---
- name: Deploy Travel Plan
  hosts: travel_plan_hosts
  become: true
  vars:
    app_directory: /opt/travel-plan
    deploy_user: travelplan
  tasks:
    - name: Create non-login application user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        system: true
        shell: /usr/sbin/nologin

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"

    - name: Copy deployment files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ app_directory }}/"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: preserve

    - name: Validate Compose configuration
      ansible.builtin.command: docker compose config --quiet
      args:
        chdir: "{{ app_directory }}"
      changed_when: false

    - name: Build and start services
      ansible.builtin.command: docker compose up --build --detach --remove-orphans
      args:
        chdir: "{{ app_directory }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"

