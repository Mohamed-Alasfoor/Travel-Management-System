global:
  scrape_interval: 15s
scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8081", "travel-service:8082", "payment-service:8083", "engagement-service:8084"]
